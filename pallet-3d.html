<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pallet Thép 3D Công Nghiệp</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f4f6f8; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        // 1. KHỞI TẠO SCENE, CAMERA & RENDERER
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f6f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(160, 120, 180);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // ĐIỀU KHIỂN XOAY 3D (ORBIT CONTROLS)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        // 2. HỆ THỐNG ÁNH SÁNG
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 80);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // 3. MẶT SÀN & LƯỚI TỌA ĐỘ
        const floorGeo = new THREE.PlaneGeometry(400, 400);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(400, 40, 0x9ca3af, 0xd1d5db);
        grid.position.y = 0.1;
        scene.add(grid);

        // 4. DỰNG MÔ HÌNH PALLET THÉP
        const steelPallet = new THREE.Group();

        // Vật liệu thép sơn tĩnh điện (Xanh dương công nghiệp)
        const steelMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1e56a0, 
            metalness: 0.6, 
            roughness: 0.3 
        });

        // Vật liệu chân đế gia cường
        const accentMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            metalness: 0.8, 
            roughness: 0.2 
        });

        // Kích thước chuẩn (Dài 1200 x Rộng 1000 x Cao 150 - Tỉ lệ 1:10)
        const length = 120, width = 100, height = 15;

        // Nan pallet mặt trên (7 thanh nan chịu lực)
        const deckCount = 7;
        const deckWidth = (length - 10) / deckCount;
        for (let i = 0; i < deckCount; i++) {
            const deckGeo = new THREE.BoxGeometry(deckWidth - 1, 2, width);
            const deckMesh = new THREE.Mesh(deckGeo, steelMaterial);
            deckMesh.castShadow = true;
            deckMesh.receiveShadow = true;
            deckMesh.position.set(-length/2 + deckWidth/2 + i * deckWidth, height - 1, 0);
            steelPallet.add(deckMesh);
        }

        // Vai chịu lực dọc (3 thanh dọc)
        const stringerPositions = [-width/2 + 4, 0, width/2 - 4];
        stringerPositions.forEach(zPos => {
            const stringerGeo = new THREE.BoxGeometry(length, 3, 6);
            const stringerMesh = new THREE.Mesh(stringerGeo, steelMaterial);
            stringerMesh.castShadow = true;
            stringerMesh.position.set(0, height - 3.5, zPos);
            steelPallet.add(stringerMesh);
        });

        // Chân trụ & Chân đế (9 cụm chịu lực)
        const xPositions = [-length/2 + 6, 0, length/2 - 6];
        const zPositions = [-width/2 + 6, 0, width/2 - 6];

        xPositions.forEach(x => {
            zPositions.forEach(z => {
                const legGeo = new THREE.BoxGeometry(8, height - 6, 8);
                const legMesh = new THREE.Mesh(legGeo, steelMaterial);
                legMesh.castShadow = true;
                legMesh.position.set(x, (height - 6) / 2 + 1.5, z);
                steelPallet.add(legMesh);

                const baseGeo = new THREE.BoxGeometry(10, 1.5, 10);
                const baseMesh = new THREE.Mesh(baseGeo, accentMaterial);
                baseMesh.castShadow = true;
                baseMesh.position.set(x, 0.75, z);
                steelPallet.add(baseMesh);
            });
        });

        // Thanh giằng đáy (3 thanh)
        zPositions.forEach(zPos => {
            const runnerGeo = new THREE.BoxGeometry(length, 1.5, 8);
            const runnerMesh = new THREE.Mesh(runnerGeo, steelMaterial);
            runnerMesh.castShadow = true;
            runnerMesh.position.set(0, 0.75, zPos);
            steelPallet.add(runnerMesh);
        });

        // Căn tâm xoay camera vào Pallet
        controls.target.set(0, height / 2, 0);
        scene.add(steelPallet);

        // 5. CẤU HÌNH RESIZE VÀ RENDER LOOP
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
