<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pallet Thép 3D</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f4f6f8; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f6f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(160, 120, 180);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Mặt sàn
        const floorGeo = new THREE.PlaneGeometry(400, 400);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(400, 40, 0x9ca3af, 0xd1d5db);
        grid.position.y = 0.1;
        scene.add(grid);

        // Khung Pallet Thép
        const palletGroup = new THREE.Group();
        const steelMaterial = new THREE.MeshStandardMaterial({
            color: 0x1d4ed8, // Xanh dương công nghiệp
            metalness: 0.5,
            roughness: 0.3
        });

        function createBeam(w, h, d, x, y, z) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, steelMaterial);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            palletGroup.add(mesh);
        }

        const width = 120, depth = 100, height = 15, thickness = 2.5;

        // Thanh mặt trên
        const numTopBeams = 7;
        const topBeamSpacing = (depth - thickness) / (numTopBeams - 1);
        for (let i = 0; i < numTopBeams; i++) {
            const zPos = -depth / 2 + thickness / 2 + i * topBeamSpacing;
            createBeam(width, thickness, 8, 0, height - thickness / 2, zPos);
        }

        // Chân đỡ dọc
        [-width / 2 + 5, 0, width / 2 - 5].forEach(xPos => {
            createBeam(thickness * 2, height - thickness * 2, depth, xPos, height / 2, 0);
        });

        // Thanh mặt đáy
        [-depth / 2 + 5, 0, depth / 2 - 5].forEach(zPos => {
            createBeam(width, thickness, 10, 0, thickness / 2, zPos);
        });

        scene.add(palletGroup);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
