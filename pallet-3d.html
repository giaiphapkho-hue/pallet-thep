<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pallet Thép Kỹ Thuật Công Nghiệp 3D</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f4f6f8; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        // 1. KHỞI TẠO SCENE & CAMERA
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f6f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(160, 110, 160);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. ÁNH SÁNG CÔNG NGHIỆP
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
        dirLight.position.set(120, 160, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Mặt sàn & Lưới
        const floorGeo = new THREE.PlaneGeometry(400, 400);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(400, 40, 0x9ca3af, 0xd1d5db);
        grid.position.y = 0.1;
        scene.add(grid);

        // 3. MÔ HÌNH PALLET THÉP TIÊU CHUẨN
        const steelPallet = new THREE.Group();

        // Vật liệu Thép sơn tĩnh điện RAL 5005 (Xanh dương công nghiệp)
        const steelMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1d4ed8, 
            metalness: 0.5, 
            roughness: 0.35 
        });

        // Vật liệu Thép mạ kẽm / Chân đệm gia cường
        const galvanizedMat = new THREE.MeshStandardMaterial({ 
            color: 0x475569, 
            metalness: 0.7, 
            roughness: 0.25 
        });

        // Thông số Pallet tiêu chuẩn (Dài 1200mm x Rộng 1000mm x Cao 150mm) - Tỉ lệ 1:10
        const L = 120, W = 100, H = 15;

        // A. NAN MẶT TRÊN (Mặt nan dập gân C-Profile chịu tải)
        const deckCount = 7;
        const deckGap = 2;
        const deckWidth = (L - (deckCount - 1) * deckGap) / deckCount; // ~15.4
        const deckThick = 2.5; // Chiều dày nan dập

        for (let i = 0; i < deckCount; i++) {
            const xPos = -L / 2 + deckWidth / 2 + i * (deckWidth + deckGap);
            
            // Thân nan dập gân
            const deckGeo = new THREE.BoxGeometry(deckWidth, deckThick, W);
            const deckMesh = new THREE.Mesh(deckGeo, steelMaterial);
            deckMesh.castShadow = true;
            deckMesh.receiveShadow = true;
            deckMesh.position.set(xPos, H - deckThick / 2, 0);
            steelPallet.add(deckMesh);

            // Mép gấp gân tăng cứng 2 bên mép nan (C-Flange)
            [-W / 2 + 0.5, W / 2 - 0.5].forEach(zEdge => {
                const flangeGeo = new THREE.BoxGeometry(deckWidth, 1.2, 1);
                const flangeMesh = new THREE.Mesh(flangeGeo, steelMaterial);
                flangeMesh.position.set(xPos, H - deckThick - 0.6, zEdge);
                steelPallet.add(flangeMesh);
            });
        }

        // B. CHÂN ĐỐ C CHỊU LỰC DỌC (C-Channel Beams - 3 Dầm chính)
        const beamPositionsZ = [-W / 2 + 6, 0, W / 2 - 6];
        const beamHeight = 9.5;
        const beamWidth = 8;

        beamPositionsZ.forEach(zPos => {
            // Thanh đố C dọc
            const beamGeo = new THREE.BoxGeometry(L, beamHeight, beamWidth);
            const beamMesh = new THREE.Mesh(beamGeo, steelMaterial);
            beamMesh.castShadow = true;
            beamMesh.receiveShadow = true;
            beamMesh.position.set(0, H - deckThick - beamHeight / 2, zPos);
            steelPallet.add(beamMesh);

            // Các lỗ khoét thoát khối lượng/cắm dĩa xe nâng 2 chiều
            [-L / 4, L / 4].forEach(xHole => {
                const holeCutGeo = new THREE.BoxGeometry(22, beamHeight - 2, beamWidth + 0.2);
                const holeCutMat = new THREE.MeshBasicMaterial({ color: 0xf4f6f8 }); // Tạo điểm ngắt trực quan
                // Giữ kết cấu liên tục bằng chân chịu lực đệm
            });
        });

        // C. THANH GIẰNG ĐÁY LỐT XE NÂNG (Bottom Skids - 3 thanh dọc liên kết)
        beamPositionsZ.forEach(zPos => {
            const skidGeo = new THREE.BoxGeometry(L, 2, beamWidth + 2);
            const skidMesh = new THREE.Mesh(skidGeo, steelMaterial);
            skidMesh.castShadow = true;
            skidMesh.receiveShadow = true;
            skidMesh.position.set(0, 1, zPos);
            steelPallet.add(skidMesh);

            // Ốp góc bảo vệ va đập xe nâng (Corner Protectors)
            [-L / 2 + 2, L / 2 - 2].forEach(xCap => {
                const capGeo = new THREE.BoxGeometry(4, beamHeight + 4, beamWidth + 2.5);
                const capMesh = new THREE.Mesh(capGeo, galvanizedMat);
                capMesh.castShadow = true;
                capMesh.position.set(xCap, (beamHeight + 4) / 2, zPos);
                steelPallet.add(capMesh);
            });
        });

        // Đặt tâm xoay OrbitControls chuẩn vị trí trung tâm Pallet
        controls.target.set(0, H / 2, 0);
        scene.add(steelPallet);

        // 4. RESIZE & RENDER LOOP
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
