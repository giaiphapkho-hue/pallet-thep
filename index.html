<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pallet Thép Công Nghiệp Cao Cấp - Cơ khí Hòa Long</title>

  <!-- Swiper CSS cho Slider -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= BÀI VIẾT & TIN TỨC SECTION ================= -->
  <section id="news" class="news-section">
    <div class="container">
      <div class="section-title">
        <h2>BÀI VIẾT & TIN TỨC MỚI NHẤT</h2>
        <p>Cập nhật xu hướng & giải pháp lưu trữ kho hàng từ Cơ Khí Hòa Long</p>
      </div>

      <!-- Swiper Slider Container -->
      <div class="swiper news-slider">
        <div class="swiper-wrapper" id="news-container">
          <!-- Nội dung bài viết sẽ được tự động render từ Contentful API qua JavaScript -->
        </div>

        <!-- Tối ưu Nút Điều Hướng Navigation (Rộng hơn, nổi bật hơn) -->
        <div class="swiper-button-next custom-nav-btn"><i class="fa-solid fa-chevron-right"></i></div>
        <div class="swiper-button-prev custom-nav-btn"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="swiper-pagination"></div>
      </div>
    </div>
  </section>

  <!-- ================= MODAL ĐỌC BÀI VIẾT CHI TIẾT (FIX LỖI MỞ ẢNH) ================= -->
  <div id="article-modal" class="article-modal" aria-hidden="true">
    <div class="modal-overlay" onclick="closeArticleModal()"></div>
    <div class="modal-container">
      <button class="modal-close-btn" onclick="closeArticleModal()" aria-label="Đóng">&times;</button>
      <article class="modal-body-content">
        <div class="modal-header">
          <span class="modal-category">BÀI VIẾT CHI TIẾT</span>
          <h1 id="modal-title">Tiêu đề bài viết</h1>
          <div class="modal-meta">
            <span><i class="fa-regular fa-clock"></i> <time id="modal-date"></time></span>
            <span><i class="fa-regular fa-user"></i> Hoa Long Mechanical</span>
          </div>
        </div>
        <div id="modal-featured-img" class="modal-featured-img"></div>
        <div id="modal-content" class="rich-text-body">
          <!-- Contentful Body (Rich Text Render) sẽ được tải vào đây -->
        </div>
      </article>
    </div>
  </div>

  <!-- Swiper JS & App JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
